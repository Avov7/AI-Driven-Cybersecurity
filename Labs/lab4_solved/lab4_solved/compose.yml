services:
  agent:
    image: cybersec-agent-workflow-lab4
    env_file: .env
    environment:
      - API_BASE_URL=https://api.groq.com/openai/v1
      - MODEL=llama-3.3-70b-versatile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /chainlit-runtime
    working_dir: /chainlit-runtime
    command: >
      chainlit run /app/app/app.py
      --host 0.0.0.0
      --port 8000
